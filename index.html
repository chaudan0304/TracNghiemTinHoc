<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chinh phục Tin học - Trắc nghiệm Tiểu học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'Nunito', system-ui, sans-serif;
      color: #064e3b;
      background: #ecfdf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #e6f9f0;
      background-image: radial-gradient(#a7f3d0 2px, transparent 2px);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: white;
      border-bottom: 2px solid #a7f3d0;
      padding: 16px max(20px, calc((100vw - 1100px)/2));
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(6, 78, 59, 0.05);
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 900;
      color: #064e3b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .teacher-link {
      text-decoration: none;
      color: #059669;
      font-weight: 800;
      font-size: 0.9rem;
      background: #ecfdf5;
      border: 1.5px solid #a7f3d0;
      padding: 8px 16px;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .teacher-link:hover {
      background: #d1fae5;
      transform: translateY(-1px);
    }
    main {
      max-width: 1100px;
      width: 100%;
      margin: 36px auto;
      padding: 0 20px;
      flex: 1;
    }
    h1 {
      font-size: 2rem;
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 10px;
      font-weight: 900;
      color: #064e3b;
    }
    .intro {
      max-width: 700px;
      color: #475569;
      line-height: 1.6;
      font-size: 1.05rem;
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #d1fae5;
      color: #065f46;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
      border: 1px solid #a7f3d0;
    }
    /* Toolbar: Tabs & Search */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      font: inherit;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 8px 18px;
      border-radius: 12px;
      border: 2px solid #a7f3d0;
      background: white;
      color: #047857;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      background: #ecfdf5;
    }
    .tab-btn.active {
      background: #059669;
      color: white;
      border-color: #047857;
      box-shadow: 0 3px 0 #047857;
    }
    .search-input {
      font: inherit;
      padding: 9px 16px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      font-size: 0.95rem;
      outline: none;
      min-width: 250px;
      background: white;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #10b981;
    }
    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
      border: 2px solid #a7f3d0;
      border-radius: 22px;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(6, 78, 59, 0.06);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      outline: none;
      border-color: #10b981;
      box-shadow: 0 14px 32px rgba(6, 78, 59, 0.12);
    }
    .card h2 {
      margin: 12px 0;
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.4;
      color: #064e3b;
    }
    .tag {
      font-weight: 800;
      color: #059669;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: #ecfdf5;
      display: inline-block;
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #a7f3d0;
    }
    .meta {
      color: #64748b;
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px dashed #e2e8f0;
    }
    .btn-start {
      margin-top: 14px;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 3px 0 #047857;
      transition: all 0.15s;
    }
    .card:hover .btn-start {
      background: #047857;
      transform: translateY(-1px);
    }
    #error {
      color: #b91c1c;
      font-weight: 800;
      text-align: center;
      margin-top: 30px;
    }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-weight: 800;
      font-size: 1.1rem;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: #059669;
      font-weight: 700;
    }
  </style>
  <link rel="stylesheet" href="/assets/mobile.css">
</head>
<body>
  <header>
    <div class="brand">💻 CHINH PHỤC TIN HỌC</div>
    <a href="/teacher" class="teacher-link">🏆 Bảng điểm & Xếp hạng</a>
  </header>

  <main>
    <h1>Chọn bài để luyện tập</h1>
    <p class="intro">Em hãy chọn bài học, nhập họ tên và lớp rồi bắt đầu làm bài. Mỗi bài có bộ câu hỏi và bảng kết quả riêng.</p>
    <div id="storage-status" class="status-badge">Đang kiểm tra trạng thái máy chủ...</div>

    <div class="controls">
      <div class="tabs" id="grade-tabs">
        <button class="tab-btn active" data-grade="all">Tất cả bài học</button>
        <button class="tab-btn" data-grade="lop-3">Lớp 3</button>
        <button class="tab-btn" data-grade="lop-4">Lớp 4</button>
        <button class="tab-btn" data-grade="lop-5">Lớp 5</button>
      </div>
      <input type="search" id="search-lesson" class="search-input" placeholder="🔍 Tìm kiếm bài học...">
    </div>

    <div id="lessons" class="grid" aria-live="polite"></div>
    <p id="error" role="alert"></p>
  </main>

  <footer>
    Học mà chơi – Chơi mà học • Chương trình Tin học Tiểu học (GDPT 2018)
  </footer>

  <script defer src="/assets/index.js"></script>
</body>
</html>
