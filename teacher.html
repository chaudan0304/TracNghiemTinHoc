<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bảng kết quả giáo viên</title>
<style>:root{font-family:system-ui,sans-serif;color:#064e3b;background:#ecfdf5}body{max-width:1100px;margin:40px auto;padding:0 20px}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #94a3b8}button{background:#059669;color:white;cursor:pointer}button:disabled{opacity:.5}main{background:white;border-radius:16px;padding:24px;overflow:auto}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0}#message{color:#b91c1c}</style></head>
<body><a href="/">← Các bài học</a><h1>Bảng kết quả giáo viên</h1><main>
<form id="login"><label>Mật khẩu giáo viên <input id="password" type="password" autocomplete="current-password" required></label> <button>Đăng nhập</button></form>
<section id="results" hidden><label>Bài học <select id="lesson"></select></label> <button id="refresh" type="button">Tải kết quả</button> <button id="export" type="button">Xuất CSV</button><table><thead><tr><th>Họ tên</th><th>Lớp</th><th>Số câu đúng</th><th>Điểm</th><th>Thời điểm nộp</th></tr></thead><tbody id="rows"></tbody></table><button id="more" type="button" hidden>Xem thêm</button></section><p id="message" role="status"></p>
</main><script type="module">
const message=document.getElementById('message');let offset=0;
async function api(url,options={}){const res=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json();if(!res.ok)throw new Error(data.error||'Có lỗi xảy ra');return data}
async function loadLessons(){const ids=await (await fetch('/lessons/index.json')).json();const select=document.getElementById('lesson');for(const id of ids){const d=await (await fetch(`/lessons/${id}.json`)).json();const opt=document.createElement('option');opt.value=id;opt.textContent=d.lessonTitle;select.append(opt)}}
async function load(reset=true){try{if(reset){offset=0;document.getElementById('rows').replaceChildren()}const id=document.getElementById('lesson').value;const data=await api(`/api/teacher?lessonId=${encodeURIComponent(id)}&offset=${offset}`);for(const row of data.rows){const tr=document.createElement('tr');for(const value of [row.student_name,row.class_name,`${row.correct_count}/${row.total_questions}`,row.score,new Date(row.submitted_at).toLocaleString('vi-VN')]){const td=document.createElement('td');td.textContent=value;tr.append(td)}document.getElementById('rows').append(tr)}offset+=data.rows.length;document.getElementById('more').hidden=data.rows.length<100;message.textContent=data.rows.length?'':(offset?'Đã hết kết quả.':'Chưa có kết quả cho bài này.')}catch(e){message.textContent=e.message}}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/teacher',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});document.getElementById('password').value='';document.getElementById('login').hidden=true;document.getElementById('results').hidden=false;await loadLessons();await load()}catch(error){message.textContent=error.message}});
document.getElementById('refresh').onclick=()=>load();document.getElementById('lesson').onchange=()=>load();document.getElementById('more').onclick=()=>load(false);
document.getElementById('export').onclick=async()=>{try{const id=document.getElementById('lesson').value;const all=[];for(let page=0;;page+=100){const {rows}=await api(`/api/teacher?lessonId=${encodeURIComponent(id)}&offset=${page}`);all.push(...rows);if(rows.length<100)break}const safe=value=>{let text=String(value??'');if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"'};const lines=[['Họ tên','Lớp','Số câu đúng','Tổng câu','Điểm','Thời điểm nộp'],...all.map(r=>[r.student_name,r.class_name,r.correct_count,r.total_questions,r.score,new Date(r.submitted_at).toLocaleString('vi-VN')])];const blob=new Blob(['\uFEFF'+lines.map(row=>row.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`Ket_Qua_${id}.csv`;link.click();URL.revokeObjectURL(url);message.textContent=`Đã xuất ${all.length} lượt làm.`}catch(e){message.textContent=e.message}};
</script></body></html>
