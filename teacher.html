<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng Quản Lý Kết Quả - Dành Cho Giáo Viên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #064e3b;
      --primary-light: #ecfdf5;
      --accent: #10b981;
      --border: #a7f3d0;
      --text: #064e3b;
      --muted: #64748b;
      --danger: #ef4444;
      --warning: #f59e0b;
      font-family: 'Nunito', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #e6f9f0;
      background-image: radial-gradient(#a7f3d0 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: white;
      border-bottom: 2px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(6, 78, 59, 0.05);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--primary-light);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .back-link:hover {
      background: #d1fae5;
      transform: translateX(-2px);
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      border: 2px solid var(--border);
      padding: 24px;
      box-shadow: 0 10px 30px rgba(6, 78, 59, 0.06);
    }
    /* Login Form */
    .login-box {
      max-width: 440px;
      margin: 60px auto;
      text-align: center;
    }
    .login-box h2 {
      margin-top: 0;
      font-size: 1.6rem;
      font-weight: 900;
    }
    .form-group {
      margin: 20px 0;
      text-align: left;
    }
    label {
      display: block;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--primary-dark);
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      font: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      background: #f0fdf4;
    }
    .btn {
      font: inherit;
      font-weight: 800;
      padding: 11px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 0 #047857;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #047857;
    }
    .btn-primary:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #047857;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #e2e8f0;
    }
    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
    }
    .btn-danger:hover {
      background: #fecaca;
    }
    /* Stats Bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--primary-light);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--primary-dark);
    }
    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-item select, .filter-item input {
      width: auto;
      min-width: 160px;
      padding: 8px 12px;
      font-size: 0.95rem;
    }
    /* Table */
    .table-responsive {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }
    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 800;
      padding: 14px 16px;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tbody tr:hover {
      background: #f8fafc;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.82rem;
    }
    .badge-excellent { background: #dcfce7; color: #15803d; }
    .badge-good { background: #e0f2fe; color: #0369a1; }
    .badge-pass { background: #fef3c7; color: #b45309; }
    .badge-low { background: #fee2e2; color: #b91c1c; }
    .score-cell {
      font-size: 1.1rem;
      font-weight: 900;
    }
    #message {
      margin-top: 16px;
      font-weight: 800;
      color: #b91c1c;
      text-align: center;
    }
    .logout-btn {
      color: #64748b;
      background: none;
      border: none;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      padding: 6px 10px;
    }
    .logout-btn:hover { color: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-link">← Danh sách bài học</a>
    <div class="header-title">🎓 BẢNG KẾT QUẢ GIÁO VIÊN</div>
    <div id="auth-actions"></div>
  </header>

  <main>
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-section" class="card login-box">
      <h2>🔒 Đăng Nhập Giáo Viên</h2>
      <p style="color: var(--muted); font-size: 0.95rem;">Nhập mật khẩu quản trị để xem bảng điểm và quản lý lượt nộp bài của học sinh.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="password">Mật khẩu giáo viên:</label>
          <input id="password" type="password" placeholder="Nhập mật khẩu..." autocomplete="current-password" required autofocus>
        </div>
        <button id="login-btn" class="btn btn-primary" style="width: 100%;">Đăng nhập</button>
      </form>
      <p id="login-error" role="alert" style="color: var(--danger); font-weight: 800; margin-top: 14px;"></p>
    </div>

    <!-- MÀN HÌNH QUẢN LÝ KẾT QUẢ -->
    <div id="dashboard-section" class="card" hidden>
      <!-- Thống kê tóm tắt -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-title">📝 Tổng lượt nộp</span>
          <span id="stat-total" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">🎯 Điểm trung bình</span>
          <span id="stat-avg" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">⭐ Điểm cao nhất</span>
          <span id="stat-max" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">🏆 Tỉ lệ Giỏi (≥ 8đ)</span>
          <span id="stat-good-ratio" class="stat-value">0%</span>
        </div>
      </div>

      <!-- Thanh công cụ lọc & tìm kiếm -->
      <div class="toolbar">
        <div class="filter-group">
          <div class="filter-item">
            <label for="lesson-select">Bài học:</label>
            <select id="lesson-select"></select>
          </div>
          <div class="filter-item">
            <label for="class-filter">Lớp:</label>
            <select id="class-filter">
              <option value="ALL">Tất cả các lớp</option>
            </select>
          </div>
          <div class="filter-item">
            <label for="search-input">Tìm học sinh:</label>
            <input id="search-input" type="search" placeholder="Nhập tên học sinh...">
          </div>
        </div>
        <div class="filter-group">
          <button id="refresh-btn" type="button" class="btn btn-secondary">🔄 Tải lại</button>
          <button id="export-btn" type="button" class="btn btn-primary">📥 Xuất file Excel (CSV)</button>
        </div>
      </div>

      <!-- Bảng kết quả -->
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th style="width: 50px;">STT</th>
              <th>Họ và tên</th>
              <th>Lớp</th>
              <th>Số câu đúng</th>
              <th>Điểm số</th>
              <th>Xếp loại</th>
              <th>Thời gian nộp</th>
              <th style="text-align: center;">Hành động</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <button id="load-more-btn" type="button" class="btn btn-secondary" hidden>Xem thêm lượt làm</button>
      </div>

      <p id="table-status" role="status" style="text-align: center; color: var(--muted); margin-top: 15px; font-weight: 700;"></p>
    </div>
  </main>

  <script type="module">
    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const authActions = document.getElementById('auth-actions');

    const lessonSelect = document.getElementById('lesson-select');
    const classFilter = document.getElementById('class-filter');
    const searchInput = document.getElementById('search-input');
    const refreshBtn = document.getElementById('refresh-btn');
    const exportBtn = document.getElementById('export-btn');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const rowsEl = document.getElementById('rows');
    const tableStatus = document.getElementById('table-status');

    let allRows = [];
    let currentLessonData = null;
    let offset = 0;

    async function api(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const errorMap = {
          INVALID_PASSWORD: 'Mật khẩu giáo viên chưa đúng.',
          TOO_MANY_ATTEMPTS: 'Đã thử sai quá nhiều lần. Vui lòng thử lại sau 15 phút.',
          STORAGE_NOT_CONFIGURED: 'Cơ sở dữ liệu chưa được kết nối.',
          TEACHER_LOGIN_NOT_CONFIGURED: 'Mật khẩu giáo viên chưa được cấu hình.',
          UNAUTHORIZED: 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.'
        };
        throw new Error(errorMap[data.error] || 'Có lỗi xảy ra, vui lòng thử lại.');
      }
      return data;
    }

    async function loadLessonList() {
      const res = await fetch('/lessons/index.json');
      const ids = await res.json();
      lessonSelect.replaceChildren();
      for (const id of ids) {
        try {
          const lres = await fetch(`/lessons/${id}.json`);
          const ldata = await lres.json();
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = `${ldata.subjectBadge ? ldata.subjectBadge + ' - ' : ''}${ldata.lessonTitle}`;
          lessonSelect.append(opt);
        } catch (e) {
          console.error(e);
        }
      }
    }

    function computeStats(items) {
      if (!items.length) {
        document.getElementById('stat-total').textContent = '0';
        document.getElementById('stat-avg').textContent = '0';
        document.getElementById('stat-max').textContent = '0';
        document.getElementById('stat-good-ratio').textContent = '0%';
        return;
      }
      const scores = items.map(r => Number(r.score) || 0);
      const total = items.length;
      const sum = scores.reduce((a, b) => a + b, 0);
      const avg = (sum / total).toFixed(1);
      const max = Math.max(...scores).toFixed(1);
      const goodCount = scores.filter(s => s >= 8).length;
      const goodRatio = Math.round((goodCount / total) * 100);

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-avg').textContent = avg;
      document.getElementById('stat-max').textContent = max;
      document.getElementById('stat-good-ratio').textContent = `${goodRatio}%`;
    }

    function updateClassFilterOptions(items) {
      const currentSelected = classFilter.value;
      const classes = Array.from(new Set(items.map(r => r.class_name).filter(Boolean))).sort();
      classFilter.replaceChildren();
      const allOpt = document.createElement('option');
      allOpt.value = 'ALL';
      allOpt.textContent = 'Tất cả các lớp';
      classFilter.append(allOpt);

      for (const cls of classes) {
        const opt = document.createElement('option');
        opt.value = cls;
        opt.textContent = `Lớp ${cls}`;
        classFilter.append(opt);
      }
      if (classes.includes(currentSelected)) {
        classFilter.value = currentSelected;
      }
    }

    function renderTable() {
      const filterClass = classFilter.value;
      const keyword = searchInput.value.trim().toLowerCase();

      const filtered = allRows.filter(r => {
        const matchClass = (filterClass === 'ALL' || r.class_name === filterClass);
        const matchName = !keyword || (r.student_name && r.student_name.toLowerCase().includes(keyword));
        return matchClass && matchName;
      });

      computeStats(filtered);
      rowsEl.replaceChildren();

      if (!filtered.length) {
        tableStatus.textContent = allRows.length ? 'Không có học sinh nào phù hợp với bộ lọc.' : 'Chưa có kết quả nộp bài cho bài học này.';
        return;
      }
      tableStatus.textContent = `Hiển thị ${filtered.length} lượt nộp bài.`;

      filtered.forEach((r, idx) => {
        const tr = document.createElement('tr');

        // STT
        const tdIdx = document.createElement('td');
        tdIdx.textContent = idx + 1;
        tdIdx.style.color = 'var(--muted)';

        // Tên
        const tdName = document.createElement('td');
        tdName.innerHTML = `<strong>${escapeHtml(r.student_name)}</strong>`;

        // Lớp
        const tdClass = document.createElement('td');
        tdClass.textContent = r.class_name;

        // Câu đúng
        const tdCorrect = document.createElement('td');
        tdCorrect.textContent = `${r.correct_count} / ${r.total_questions}`;

        // Điểm
        const tdScore = document.createElement('td');
        tdScore.className = 'score-cell';
        tdScore.textContent = Number(r.score).toFixed(1);

        // Xếp loại badge
        const tdBadge = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge';
        const numScore = Number(r.score);
        if (numScore >= 8.5) {
          badge.className += ' badge-excellent';
          badge.textContent = 'Xuất sắc';
        } else if (numScore >= 7.0) {
          badge.className += ' badge-good';
          badge.textContent = 'Khá';
        } else if (numScore >= 5.0) {
          badge.className += ' badge-pass';
          badge.textContent = 'Đạt';
        } else {
          badge.className += ' badge-low';
          badge.textContent = 'Cần cố gắng';
        }
        tdBadge.append(badge);

        // Thời gian nộp
        const tdTime = document.createElement('td');
        tdTime.style.color = 'var(--muted)';
        tdTime.textContent = new Date(r.submitted_at).toLocaleString('vi-VN');

        // Thao tác (Xóa)
        const tdAction = document.createElement('td');
        tdAction.style.textAlign = 'center';
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn-danger';
        delBtn.innerHTML = '🗑️ Xóa';
        delBtn.title = 'Xóa lượt nộp này';
        delBtn.onclick = async () => {
          if (!confirm(`Thầy/cô có chắc muốn xóa lượt làm bài của em "${r.student_name}" (Lớp ${r.class_name})?`)) return;
          try {
            await api('/api/teacher', {
              method: 'DELETE',
              body: JSON.stringify({ id: r.id })
            });
            allRows = allRows.filter(item => item.id !== r.id);
            updateClassFilterOptions(allRows);
            renderTable();
          } catch (err) {
            alert('Không thể xóa: ' + err.message);
          }
        };
        tdAction.append(delBtn);

        tr.append(tdIdx, tdName, tdClass, tdCorrect, tdScore, tdBadge, tdTime, tdAction);
        rowsEl.append(tr);
      });
    }

    async function fetchResults(reset = true) {
      try {
        if (reset) {
          offset = 0;
          allRows = [];
        }
        const lessonId = lessonSelect.value;
        if (!lessonId) return;

        tableStatus.textContent = 'Đang tải danh sách kết quả...';
        const data = await api(`/api/teacher?lessonId=${encodeURIComponent(lessonId)}&offset=${offset}`);
        
        allRows = reset ? data.rows : [...allRows, ...data.rows];
        offset += data.rows.length;
        loadMoreBtn.hidden = data.rows.length < 100;

        updateClassFilterOptions(allRows);
        renderTable();
      } catch (e) {
        tableStatus.textContent = e.message;
        if (e.message.includes('đăng nhập lại') || e.message.includes('hết hạn')) {
          showLogin();
        }
      }
    }

    function showDashboard() {
      loginSection.hidden = true;
      dashboardSection.hidden = false;
      const logoutBtn = document.createElement('button');
      logoutBtn.className = 'logout-btn';
      logoutBtn.textContent = '🚪 Đăng xuất';
      logoutBtn.onclick = async () => {
        try {
          await api('/api/teacher', {
            method: 'POST',
            body: JSON.stringify({ action: 'logout' })
          });
        } catch (e) {
          console.error('Logout error:', e);
        }
        location.reload();
      };
      authActions.replaceChildren(logoutBtn);
    }

    function showLogin() {
      loginSection.hidden = false;
      dashboardSection.hidden = true;
      authActions.replaceChildren();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Đang kiểm tra...';
      try {
        await api('/api/teacher', {
          method: 'POST',
          body: JSON.stringify({ password })
        });
        document.getElementById('password').value = '';
        showDashboard();
        await loadLessonList();
        await fetchResults(true);
      } catch (err) {
        loginError.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Đăng nhập';
      }
    });

    lessonSelect.addEventListener('change', () => fetchResults(true));
    refreshBtn.addEventListener('click', () => fetchResults(true));
    classFilter.addEventListener('change', renderTable);
    searchInput.addEventListener('input', renderTable);
    loadMoreBtn.addEventListener('click', () => fetchResults(false));

    exportBtn.addEventListener('click', async () => {
      try {
        const id = lessonSelect.value;
        if (!id) return;
        exportBtn.disabled = true;
        exportBtn.textContent = 'Đang trích xuất...';

        const all = [];
        for (let page = 0; ; page += 100) {
          const { rows } = await api(`/api/teacher?lessonId=${encodeURIComponent(id)}&offset=${page}`);
          all.push(...rows);
          if (rows.length < 100) break;
        }

        const safe = value => {
          let text = String(value ?? '');
          if (/^[=+@\-\t\r]/.test(text)) text = "'" + text;
          return '"' + text.replaceAll('"', '""') + '"';
        };

        const lines = [
          ['STT', 'Họ và tên', 'Lớp', 'Số câu đúng', 'Tổng câu hỏi', 'Điểm', 'Thời điểm nộp'],
          ...all.map((r, i) => [
            i + 1,
            r.student_name,
            r.class_name,
            r.correct_count,
            r.total_questions,
            Number(r.score).toFixed(1),
            new Date(r.submitted_at).toLocaleString('vi-VN')
          ])
        ];

        const csvContent = '\uFEFF' + lines.map(row => row.map(safe).join(',')).join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Ket_Qua_${id}.csv`;
        link.click();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('Lỗi xuất file: ' + e.message);
      } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = '📥 Xuất file Excel (CSV)';
      }
    });

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Tự động kiểm tra nếu đã có phiên đăng nhập
    (async function checkExistingSession() {
      try {
        await loadLessonList();
        const firstLesson = lessonSelect.value;
        if (firstLesson) {
          const test = await api(`/api/teacher?lessonId=${encodeURIComponent(firstLesson)}&offset=0`);
          showDashboard();
          allRows = test.rows;
          updateClassFilterOptions(allRows);
          renderTable();
        }
      } catch (e) {
        showLogin();
      }
    })();
  </script>
</body>
